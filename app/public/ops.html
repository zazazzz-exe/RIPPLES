<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ripples · Scorecard</title>
  <meta name="description" content="Scorecard, open gaps, follow-up accountability and drafts awaiting approval. Sample data.">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/brand/ripples-mark-32.png">
  <link rel="apple-touch-icon" href="/img/brand/ripples-mark-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <script type="module" src="/js/pages/ops.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <div id="chrome"></div>
    <main id="main"><div id="page">
      <div class="page-head">
        <h1>Climate Scorecard</h1>
        <p>Promises kept, open gaps and follow-up accountability across all tracked cities, plus every draft waiting for a person to approve it.</p>
      </div>
      <div class="kpi-groups" id="kpis"></div>
      <nav class="tabs" id="tabs" role="tablist" aria-label="Scorecard sections"></nav>
      <div id="panel-overview" role="tabpanel" aria-labelledby="tab-overview"></div>
      <div id="panel-cities" role="tabpanel" aria-labelledby="tab-cities" hidden></div>
      <div id="panel-projects" role="tabpanel" aria-labelledby="tab-projects" hidden>
        <section class="card">
          <div class="form toolbar-form" id="projectFilters"></div>
          <div id="projectTable" style="margin-top:12px"></div>
        </section>
      </div>
      <div id="panel-followups" role="tabpanel" aria-labelledby="tab-followups" hidden></div>
      <div id="panel-approvals" role="tabpanel" aria-labelledby="tab-approvals" hidden></div>
    </div></main>
  </div>
  <div id="navs"></div>
</body>
</html>
