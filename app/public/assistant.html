<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ripples · City Assistant</title>
  <meta name="description" content="Ask about open gaps, risk levels, evacuation centers and follow-ups. Sample data.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ff2e5b'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%234cc3ff' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <script type="module" src="/js/pages/assistant.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <div id="chrome"></div>
    <main id="main"><div id="page">
      <div class="page-head">
        <h1>City Assistant</h1>
        <p>Ask about open gaps, risk levels, evacuation centers and follow-up replies, or ask it to draft advisory guidance. Answers come from the sample records with citations. For live warnings it points you to PAGASA and NDRRMC.</p>
      </div>
      <div class="chat" id="chat" aria-live="polite"></div>
      <div class="chips" id="suggestions" style="margin-top:12px"></div>
      <form class="composer" id="ask">
        
        <input id="q" name="q" aria-label="Your question" autocomplete="off" maxlength="500" placeholder="Ask about a city…" required>
        <button class="btn primary" type="submit">Ask</button>
      </form>
    </div></main>
  </div>
  <div id="navs"></div>
</body>
</html>
